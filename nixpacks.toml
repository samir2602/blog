[phases.setup]
nixPkgs = ["php82", "php82Extensions.mbstring", "php82Extensions.xml", "php82Extensions.tokenizer", "php82Extensions.pdo", "php82Extensions.pdo_mysql", "php82Extensions.curl", "php82Extensions.zip", "composer", "nodejs_20", "nodePackages.npm"]

[phases.build]
cmds = ["composer install --no-dev", "npm ci", "npm run build"]

[start]
cmd = "php artisan migrate --force && php artisan db:seed --class=CategorySeeder --force && php artisan config:cache && php artisan route:cache && php artisan view:cache && php artisan serve --host=0.0.0.0 --port=$PORT"